[project]
name = "cosmosdb-spark-datasource"
version = "1.0.0"
description = "PySpark Python data source for Azure Cosmos DB for NoSQL: parallel batch reads and change-feed streaming for Databricks serverless and Lakeflow Spark Declarative Pipelines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mehdi Modarressi" }]
requires-python = ">=3.10"
keywords = [
    "spark",
    "pyspark",
    "databricks",
    "lakeflow",
    "azure",
    "cosmos-db",
    "cosmosdb",
    "change-feed",
    "datasource",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# pyspark is not a runtime dependency: the Spark runtime provides it.
dependencies = [
    # feed_range scoping for query_items arrived in 4.14; the change-feed continuation format used
    # by this package was verified against 4.17.1.
    "azure-cosmos>=4.14.0,<5",
]

[project.urls]
Homepage = "https://github.com/Mmodarre/cosmosdb-spark-datasource"
Documentation = "https://github.com/Mmodarre/cosmosdb-spark-datasource#readme"
Issues = "https://github.com/Mmodarre/cosmosdb-spark-datasource/issues"
Changelog = "https://github.com/Mmodarre/cosmosdb-spark-datasource/blob/main/CHANGELOG.md"

[project.optional-dependencies]
identity = [
    "azure-identity>=1.19,<2",
]

[build-system]
# Admits the uv version of the workflows (UV_VERSION), so builds use its built-in backend.
requires = ["uv_build>=0.11.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cosmosdb_datasource"

[dependency-groups]
dev = [
    "azure-identity>=1.19",
    "mypy>=2.4",
    # Spark's mapInArrow, which read_many runs, needs pandas; PySpark 4.0 to 4.2 warn about pandas 3.
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "pyspark>=4.0,<4.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    { include-group = "coverage" },
    { include-group = "lint" },
]
coverage = [
    "coverage>=7.10.6",
]
lint = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "S110"]
ignore = [
    "UP007",   # keep Optional/Union readable where used
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE001", "B011"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["cosmosdb_datasource"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a Cosmos DB endpoint: run them with `uv run pytest -m integration`
# (a later -m on the command line overrides this default).
addopts = "-m 'not integration'"
markers = [
    "integration: needs a Cosmos DB account or emulator (COSMOS_ENDPOINT, COSMOS_KEY); skipped otherwise",
    "spark: needs a local SparkSession (Java 17+); skipped otherwise",
    "requires_avad: needs the AllVersionsAndDeletes change feed (no emulator has it)",
    "requires_epk_ranges: needs EPK sub-range filtering of queries and change feed (not in the vNext emulator)",
    "requires_multi_partition: needs containers with several physical partitions (not in the vNext emulator)",
    "requires_session_tokens: needs Session consistency with enforced session tokens (not in the vNext emulator)",
    "requires_aad: needs Entra ID credentials for DefaultAzureCredential (no emulator has it)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]
