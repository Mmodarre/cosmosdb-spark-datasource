name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.1"
  TWINE_VERSION: "7.0.0"
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          project_version="$(uv version --short --color never)"
          if [ "$version" != "$project_version" ]; then
            echo "::error::Tag $TAG does not match the version in pyproject.toml ($project_version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main."
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (pre-release: $prerelease)"
      - name: Build the sdist and wheel
        run: uv build
      - name: twine check
        run: uvx "twine@${TWINE_VERSION}" check --strict dist/*
      - name: Check the distribution contents and metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project python .github/scripts/check_dist.py --expect-version "$VERSION" dist
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project python .github/scripts/changelog_section.py "$VERSION" > release-notes.md
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ vars.PUBLISH_TO_TESTPYPI == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cosmosdb-spark-datasource/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: [build, testpypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.testpypi.result != 'failure' && vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cosmosdb-spark-datasource/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    needs: [build, testpypi, pypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.testpypi.result != 'failure' && needs.pypi.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" artifacts/dist/* \
            --verify-tag --title "$TAG" --notes-file artifacts/release-notes/release-notes.md "${flags[@]}"
