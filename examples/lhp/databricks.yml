# Bundle for the pipelines generated by Lakehouse Plumber. Generate first, every time:
#   lhp generate --env dev --pipeline-config config/pipeline_config.yaml
#   databricks bundle validate && databricks bundle deploy
#
# resources/lhp/*.yml (pipelines) and generated/<target>/ (pipeline code) are written by
# `lhp generate` and gitignored. Target names must match the substitution environments
# (substitutions/<target>.yaml). No workspace host is set: the CLI profile selects the workspace.
bundle:
  name: cosmosdb_lhp_example

include:
  - resources/lhp/*.yml

# generated/ is gitignored, and bundle file sync skips gitignored files unless they are included.
sync:
  include:
    - generated/${bundle.target}/**

targets:
  dev:
    mode: development
    default: true
